{% extends "base.html" %}
{% block title %}Daftar Akun Pemilih{% endblock %}

{% block content %}
<div class="min-h-[65vh] flex items-center justify-center py-10 px-4">
  <div class="max-w-md w-full space-y-6 bg-[#131822] border border-[#232B3A] p-7 rounded-xl shadow-md">
    
    <div class="text-center space-y-1.5">
      <div class="w-10 h-10 rounded bg-[#EE0000] mx-auto flex items-center justify-center text-white shadow-md shadow-[#EE0000]/20">
        <i data-lucide="user-plus" class="w-5 h-5"></i>
      </div>
      <h2 class="font-heading font-extrabold text-xl text-white tracking-tight pt-2">Registrasi Pemilih</h2>
      <p class="text-xs text-slate-400">Daftarkan akun mahasiswa untuk menggunakan hak pilih Anda</p>
    </div>

    <!-- Registration Form -->
    <form method="POST" action="{{ url_for('register') }}" class="space-y-3.5">
      <div>
        <label for="npm" class="block text-xs font-mono font-bold text-slate-300 uppercase tracking-wider mb-1">
          NPM Mahasiswa
        </label>
        <div class="relative">
          <i data-lucide="hash" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input id="npm" name="npm" type="text" required 
                 placeholder="Contoh: 24.83.1107"
                 class="w-full pl-9 pr-3 py-2 bg-[#19202C] border border-[#232B3A] rounded-md text-xs text-white placeholder-slate-500 font-mono focus:outline-none focus:border-[#EE0000] focus:ring-1 focus:ring-[#EE0000] transition-all">
        </div>
      </div>

      <div>
        <label for="nama" class="block text-xs font-mono font-bold text-slate-300 uppercase tracking-wider mb-1">
          Nama Lengkap
        </label>
        <div class="relative">
          <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input id="nama" name="nama" type="text" required 
                 placeholder="Nama sesuai kartu mahasiswa"
                 class="w-full pl-9 pr-3 py-2 bg-[#19202C] border border-[#232B3A] rounded-md text-xs text-white placeholder-slate-500 focus:outline-none focus:border-[#EE0000] focus:ring-1 focus:ring-[#EE0000] transition-all">
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-mono font-bold text-slate-300 uppercase tracking-wider mb-1">
          Kata Sandi (Min 6 Karakter)
        </label>
        <div class="relative">
          <i data-lucide="key-round" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input id="password" name="password" type="password" minlength="6" required 
                 placeholder="••••••••"
                 class="w-full pl-9 pr-3 py-2 bg-[#19202C] border border-[#232B3A] rounded-md text-xs text-white placeholder-slate-500 focus:outline-none focus:border-[#EE0000] focus:ring-1 focus:ring-[#EE0000] transition-all">
        </div>
      </div>

      <div>
        <label for="password2" class="block text-xs font-mono font-bold text-slate-300 uppercase tracking-wider mb-1">
          Konfirmasi Kata Sandi
        </label>
        <div class="relative">
          <i data-lucide="check-check" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
          <input id="password2" name="password2" type="password" minlength="6" required 
                 placeholder="••••••••"
                 class="w-full pl-9 pr-3 py-2 bg-[#19202C] border border-[#232B3A] rounded-md text-xs text-white placeholder-slate-500 focus:outline-none focus:border-[#EE0000] focus:ring-1 focus:ring-[#EE0000] transition-all">
        </div>
      </div>

      <button type="submit" class="w-full py-2.5 bg-[#EE0000] hover:bg-[#CC0000] text-white rounded-md text-xs font-bold shadow-sm transition-all flex items-center justify-center space-x-2 pt-2">
        <i data-lucide="user-check" class="w-4 h-4"></i>
        <span>Daftar Akun Pemilih</span>
      </button>
    </form>

    <div class="text-center pt-3 border-t border-[#232B3A]">
      <p class="text-xs text-slate-400">
        Sudah memiliki akun terdaftar? 
        <a href="{{ url_for('login') }}" class="font-bold text-red-400 hover:text-red-300 transition-colors">Masuk di sini</a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
