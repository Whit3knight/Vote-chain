{% extends "base.html" %}
{% block title %}Daftar Akun Pemilih{% endblock %}

{% block content %}
<div class="min-h-[65vh] flex items-center justify-center py-10 px-4">
  <div class="max-w-md w-full space-y-6 bg-slate-900/90 border border-slate-800 p-8 rounded-2xl shadow-xl backdrop-blur-xl">
    
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 mx-auto flex items-center justify-center text-emerald-400">
        <i data-lucide="user-plus" class="w-6 h-6"></i>
      </div>
      <h2 class="font-heading font-extrabold text-2xl text-white tracking-tight pt-1">Registrasi Akun Pemilih</h2>
      <p class="text-xs text-slate-400">Daftarkan Nomor Pokok Mahasiswa (NPM) untuk memberikan suara</p>
    </div>

    <!-- Registration Form -->
    <form method="POST" action="{{ url_for('register') }}" class="space-y-4">
      <div>
        <label for="npm" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
          NPM Mahasiswa
        </label>
        <div class="relative">
          <i data-lucide="hash" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input id="npm" name="npm" type="text" required 
                 placeholder="Contoh: 24.83.1107"
                 class="w-full pl-10 pr-3.5 py-2.5 bg-slate-950/80 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 font-mono focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
        </div>
      </div>

      <div>
        <label for="nama" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
          Nama Lengkap
        </label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input id="nama" name="nama" type="text" required 
                 placeholder="Nama sesuai kartu mahasiswa"
                 class="w-full pl-10 pr-3.5 py-2.5 bg-slate-950/80 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
          Kata Sandi (Min 6 Karakter)
        </label>
        <div class="relative">
          <i data-lucide="key-round" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input id="password" name="password" type="password" minlength="6" required 
                 placeholder="••••••••"
                 class="w-full pl-10 pr-3.5 py-2.5 bg-slate-950/80 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
        </div>
      </div>

      <div>
        <label for="password2" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
          Konfirmasi Kata Sandi
        </label>
        <div class="relative">
          <i data-lucide="check-check" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input id="password2" name="password2" type="password" minlength="6" required 
                 placeholder="••••••••"
                 class="w-full pl-10 pr-3.5 py-2.5 bg-slate-950/80 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
        </div>
      </div>

      <button type="submit" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-xl text-xs font-extrabold shadow-md shadow-emerald-500/20 transition-all flex items-center justify-center space-x-2 pt-2">
        <i data-lucide="user-check" class="w-4 h-4"></i>
        <span>Daftar Akun Pemilih</span>
      </button>
    </form>

    <div class="text-center pt-4 border-t border-slate-800">
      <p class="text-xs text-slate-400">
        Sudah memiliki akun terdaftar? 
        <a href="{{ url_for('login') }}" class="font-bold text-emerald-400 hover:text-emerald-300 transition-colors">Masuk di sini</a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
