{% extends "base.html" %}
{% block title %}Masuk System{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-slate-900/90 border border-slate-800 p-8 rounded-2xl shadow-2xl relative overflow-hidden backdrop-blur-xl">
    
    <!-- Background Glow Effect -->
    <div class="absolute -top-20 -left-20 w-48 h-48 bg-blue-600/10 rounded-full blur-2xl pointer-events-none"></div>

    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 p-0.5 mx-auto shadow-lg shadow-blue-500/20">
        <div class="w-full h-full bg-[#0B0F19] rounded-[14px] flex items-center justify-center">
          <i data-lucide="lock" class="w-6 h-6 text-blue-400"></i>
        </div>
      </div>
      <h2 class="font-heading font-extrabold text-2xl text-white tracking-tight">Otentikasi Akun</h2>
      <p class="text-xs text-slate-400">Masuk dengan Nomor Pokok Mahasiswa (NPM) atau akun Admin</p>
    </div>

    <!-- Login Form -->
    <form method="POST" action="{{ url_for('login') }}" class="mt-8 space-y-5">
      <div>
        <label for="npm" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          NPM / ID Pengguna
        </label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input id="npm" name="npm" type="text" required 
                 placeholder="Contoh: 24.83.1107 atau admin"
                 class="w-full pl-10 pr-4 py-3 bg-slate-950/80 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all font-mono">
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Kata Sandi
        </label>
        <div class="relative">
          <i data-lucide="key" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input id="password" name="password" type="password" required 
                 placeholder="••••••••"
                 class="w-full pl-10 pr-4 py-3 bg-slate-950/80 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
        </div>
      </div>

      <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl text-sm font-bold shadow-lg shadow-blue-600/30 transition-all flex items-center justify-center space-x-2">
        <i data-lucide="log-in" class="w-4 h-4"></i>
        <span>Masuk ke Platform</span>
      </button>
    </form>

    <div class="text-center pt-4 border-t border-slate-800">
      <p class="text-xs text-slate-400">
        Belum memiliki akun pemilih? 
        <a href="{{ url_for('register') }}" class="font-semibold text-blue-400 hover:text-blue-300 transition-colors">Daftar sekarang</a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
